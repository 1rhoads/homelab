groups:
  - name: homelab-alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: HighCpuUsage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU load on {{ $labels.instance }} is above 90% for over 5 minutes."

      - alert: HighMemoryUsage
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} is above 90% for over 5 minutes."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Root partition on {{ $labels.instance }} has less than 10% available space."

      # -----------------------------------------------------------------------
      # Network Loops, Broadcast Storms & Interface Telemetry Alerts
      # -----------------------------------------------------------------------
      - alert: NetworkBroadcastStorm
        expr: rate(mikrotik_interface_receive_packets_total{type="ether"}[1m]) > 20000
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Potential Broadcast Storm or L2 Loop on {{ $labels.instance }} ({{ $labels.interface }})"
          description: "Interface {{ $labels.interface }} is receiving {{ $value }} packets/sec for >30s, indicating an active loop or broadcast flood."

      - alert: SwitchInterfacePacketDrops
        expr: rate(mikrotik_interface_receive_drop_total[1m]) > 50 or rate(mikrotik_interface_transmit_drop_total[1m]) > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High packet drop rate on {{ $labels.instance }} ({{ $labels.interface }})"
          description: "Interface {{ $labels.interface }} buffer is dropping {{ $value }} packets/sec (possible loop or link congestion)."

      - alert: SwitchLinkFlapping
        expr: rate(mikrotik_interface_link_downs_total{type="ether"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Link flapping on {{ $labels.instance }} ({{ $labels.interface }})"
          description: "Port {{ $labels.interface }} has experienced repeated link state changes in the last 5 minutes (flapping or RSTP port blocking/unblocking)."

      - alert: OpenWrtBroadcastMulticastFlood
        expr: sum by (instance) (rate(node_network_receive_multicast_total{job="openwrt"}[1m])) > 5000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Excessive multicast/broadcast flood on Access Point {{ $labels.instance }}"
          description: "OpenWrt node {{ $labels.instance }} is receiving {{ $value }} multicast/broadcast packets/sec, indicating a possible wireless mesh bridge loop."

      # -----------------------------------------------------------------------
      # Container Security Alerts
      # -----------------------------------------------------------------------
      - alert: CriticalVulnerabilityDetected
        expr: sum(trivy_image_vulnerabilities{severity="CRITICAL"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Critical vulnerabilities detected in containers"
          description: "{{ $value }} CRITICAL vulnerabilities identified in running container images."
