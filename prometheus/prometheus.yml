global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Caddy Reverse Proxy & HTTP Metrics
  - job_name: "caddy"
    static_configs:
      - targets: ["caddy:2019"]

  # Proxmox VE Nodes (via node_exporter port 9100 or proxmox-pve-exporter port 9221)
  - job_name: "proxmox"
    scrape_interval: 15s
    static_configs:
      - targets:
          # - "192.168.1.10:9100"   # PVE Node 1
          # - "192.168.1.11:9100"   # PVE Node 2
        labels:
          role: "hypervisor"
          platform: "proxmox"

  # MikroTik Switches & Routers (RouterOS v7 native metrics or SNMP exporter)
  - job_name: "mikrotik"
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          # - "192.168.1.2:80"      # Switch 1 (Core)
          # - "192.168.1.3:80"      # Switch 2 (Distribution / PoE)
          # - "192.168.1.4:80"      # Switch 3 (Edge)
        labels:
          role: "switch"
          vendor: "mikrotik"

  # OpenWrt Access Points (via 'prometheus-node-exporter-lua' on port 9100)
  - job_name: "openwrt"
    scrape_interval: 30s
    static_configs:
      - targets:
          # - "192.168.1.11:9100"   # OpenWrt AP 1 (Living Room)
          # - "192.168.1.12:9100"   # OpenWrt AP 2 (Office / Upper)
          # - "192.168.1.13:9100"   # OpenWrt AP 3 (Outdoor / Garage)
        labels:
          role: "access_point"
          vendor: "openwrt"

  # Linux Hosts / VMs / LXCs (General Node Exporter)
  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets:
          # - "192.168.1.20:9100"
        labels:
          role: "server"
