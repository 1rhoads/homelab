global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Caddy Reverse Proxy & HTTP Metrics
  - job_name: "caddy"
    static_configs:
      - targets: ["homelab_caddy:2019"]

  # Docker Host (docker-homelab.iye.internal)
  - job_name: "docker-host"
    scrape_interval: 15s
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          role: "docker-host"
          instance: "docker-homelab.iye.internal"

  # Proxmox VE Nodes (via node_exporter port 9100)
  - job_name: "proxmox"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "virt-1.iye.internal:9100"
          - "virt-2.iye.internal:9100"
          - "virt-3.iye.internal:9100"
        labels:
          role: "hypervisor"
          platform: "proxmox"

  # OpenWrt Access Points (via prometheus-node-exporter-lua on port 9100)
  - job_name: "openwrt"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "ap-outside.iye.internal:9100"
          - "ap-callie.iye.internal:9100"
          - "ap-robert.iye.internal:9100"
          - "ap-garage.iye.internal:9100"
          - "ap-printer.iye.internal:9100"
          - "ap-fort.iye.internal:9100"
        labels:
          role: "access_point"
          vendor: "openwrt"

  # MikroTik Switches & Routers (RouterOS / SwOS)
  - job_name: "mikrotik"
    scrape_interval: 30s
    static_configs:
      - targets:
          # - "switch-1.iye.internal"
          # - "switch-2.iye.internal"
        labels:
          role: "switch"
          vendor: "mikrotik"
