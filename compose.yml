            </div>
          </div>

          <div class="footer">
            <a href="https://homelab.iye.internal">&larr; Return to Homelab Operations Dashboard</a> &bull; <a href="https://grafana.iye.internal/d/trivy-security">Grafana Security Dashboard &rarr;</a>
          </div>
        </div>
      </body>
      </html>
  prom_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      rule_files:
        - "/etc/prometheus/alerts.yml"

      scrape_configs:
        # Prometheus Self-Monitoring
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]

        # Caddy Reverse Proxy & HTTP Metrics
        - job_name: "caddy"
          static_configs:
            - targets: ["homelab_caddy:2019"]

        # Docker Host (docker-homelab.iye.internal)
        - job_name: "docker-host"
          scrape_interval: 15s
          static_configs:
            - targets: ["node_exporter:9100"]
              labels:
                role: "docker-host"
                instance: "${PORTAINER_HOST:-docker-homelab.iye.internal}"

        # Proxmox VE Nodes (via node_exporter port 9100)
        - job_name: "proxmox"
          scrape_interval: 15s
          static_configs:
            - targets:
                - "${PROXMOX_NODE1_HOST:-virt-1.iye.internal}:9100"
                - "${PROXMOX_NODE2_HOST:-virt-2.iye.internal}:9100"
                - "${PROXMOX_NODE3_HOST:-virt-3.iye.internal}:9100"
              labels:
                role: "hypervisor"
                platform: "proxmox"

        # OpenWrt Access Points (via prometheus-node-exporter-lua on port 9100)
        - job_name: "openwrt"
          scrape_interval: 30s
          static_configs:
            - targets:
                - "${OPENWRT_AP1_HOST:-ap-outside.iye.internal}:9100"
                - "${OPENWRT_AP2_HOST:-ap-callie.iye.internal}:9100"
                - "${OPENWRT_AP3_HOST:-ap-robert.iye.internal}:9100"
                - "${OPENWRT_AP4_HOST:-ap-garage.iye.internal}:9100"
                - "${OPENWRT_AP5_HOST:-ap-printer.iye.internal}:9100"
                - "${OPENWRT_AP6_HOST:-ap-fort.iye.internal}:9100"
              labels:
                role: "access_point"
                vendor: "openwrt"

        # MikroTik Switches & Routers (RouterOS / SwOS)
        - job_name: "mikrotik"
          scrape_interval: 30s
          static_configs:
            - targets:
                # - "${MIKROTIK_CORE_HOST:-switch-1.iye.internal}"
                # - "${MIKROTIK_SW2_HOST:-switch-2.iye.internal}"
              labels:
                role: "switch"
                vendor: "mikrotik"

        # NetBox IPAM & DCIM
        - job_name: "netbox"
          scrape_interval: 30s
          metrics_path: "/metrics"
          static_configs:
            - targets: ["netbox:8080"]
              labels:
                role: "ipam"
                service: "netbox"

        # Trivy Vulnerability Exporter
        - job_name: "trivy"
          scrape_interval: 30s
          static_configs:
            - targets: ["trivy_exporter:9091"]
              labels:
                role: "security"
                service: "trivy"
  prom_alerts:
    content: |
      groups:
        - name: homelab-alerts
          rules:
            - alert: InstanceDown
              expr: up == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Instance {{ $$labels.instance }} is down"
                description: "{{ $$labels.job }} target {{ $$labels.instance }} has been unreachable for more than 2 minutes."

            - alert: HighCpuUsage
              expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High CPU usage on {{ $$labels.instance }}"
                description: "CPU load on {{ $$labels.instance }} is above 90% for over 5 minutes."

            - alert: HighMemoryUsage
              expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High Memory usage on {{ $$labels.instance }}"
                description: "Memory usage on {{ $$labels.instance }} is above 90% for over 5 minutes."

            - alert: LowDiskSpace
              expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Low disk space on {{ $$labels.instance }}"
                description: "Root partition on {{ $$labels.instance }} has less than 10% available space."

            - alert: CriticalVulnerabilityDetected
              expr: sum(trivy_image_vulnerabilities{severity="CRITICAL"}) > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Critical vulnerabilities detected in containers"
                description: "{{ $$value }} CRITICAL vulnerabilities identified in running container images."
