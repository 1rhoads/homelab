services:
  # ---------------------------------------------------------------------------
  # Caddy: Ingress Gateway & Reverse Proxy with Automatic Internal TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: homelab_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - "DOMAIN=${DOMAIN:-iye.internal}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # ---------------------------------------------------------------------------
  # Homepage: Modern, Highly Customizable Homelab Application Dashboard
  # ---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    ports:
      - "3001:3000"
    environment:
      - "TZ=${TZ:-UTC}"
      - "HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-*}"
      - "HOMEPAGE_VAR_DOMAIN=${DOMAIN:-iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE1_HOST=${PROXMOX_NODE1_HOST:-pve1.iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE2_HOST=${PROXMOX_NODE2_HOST:-pve2.iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE3_HOST=${PROXMOX_NODE3_HOST:-pve3.iye.internal}"
      - "HOMEPAGE_VAR_PORTAINER_HOST=${PORTAINER_HOST:-portainer.iye.internal}"
      - "HOMEPAGE_VAR_MIKROTIK_CORE_HOST=${MIKROTIK_CORE_HOST:-sw-core.iye.internal}"
      - "HOMEPAGE_VAR_MIKROTIK_SW2_HOST=${MIKROTIK_SW2_HOST:-sw-poe.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP1_HOST=${OPENWRT_AP1_HOST:-ap-outside.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP2_HOST=${OPENWRT_AP2_HOST:-ap-callie.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP3_HOST=${OPENWRT_AP3_HOST:-ap-robert.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP4_HOST=${OPENWRT_AP4_HOST:-ap-garage.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP5_HOST=${OPENWRT_AP5_HOST:-ap-printer.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP6_HOST=${OPENWRT_AP6_HOST:-ap-fort.iye.internal}"
    configs:
      - source: homepage_settings
        target: /app/config/settings.yaml
      - source: homepage_services
        target: /app/config/services.yaml
      - source: homepage_widgets
        target: /app/config/widgets.yaml
      - source: homepage_bookmarks
        target: /app/config/bookmarks.yaml
      - source: homepage_docker
        target: /app/config/docker.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------------------
  # MariaDB: Backend Database for LibreNMS
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: librenms_db
    restart: always
    command:
      - "mysqld"
      - "--innodb-file-per-table=1"
      - "--lower-case-table-names=0"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - "TZ=${TZ:-UTC}"
      - "MARIADB_RANDOM_ROOT_PASSWORD=yes"
      - "MYSQL_DATABASE=${MYSQL_DATABASE:-librenms}"
      - "MYSQL_USER=${MYSQL_USER:-librenms}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD:-librenms}"

  # ---------------------------------------------------------------------------
  # Redis: In-Memory Cache and Queue for LibreNMS
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: librenms_redis
    restart: always
    environment:
      - "TZ=${TZ:-UTC}"

  # ---------------------------------------------------------------------------
  # msmtpd: Outbound Mail Relay for Alerting
  # ---------------------------------------------------------------------------
  msmtpd:
    image: crazymax/msmtpd:latest
    container_name: librenms_msmtpd
    restart: always
    environment:
      - "TZ=${TZ:-UTC}"
      - "SMTP_HOST=${SMTP_HOST:-localhost}"
      - "SMTP_PORT=${SMTP_PORT:-25}"
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false

  # ---------------------------------------------------------------------------
  # LibreNMS: Core Network Monitoring System
  # ---------------------------------------------------------------------------
  librenms:
    image: librenms/librenms:latest
    container_name: librenms
    hostname: librenms
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "3300:8000"
    depends_on:
      - db
      - redis
      - msmtpd
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "LIBRENMS_BASE_URL=${LIBRENMS_BASE_URL:-https://librenms.${DOMAIN:-iye.internal}}"
      - "APP_URL=https://librenms.${DOMAIN:-iye.internal}"
      - "APP_TRUSTED_PROXIES=*"
      - "LIBRENMS_SNMP_COMMUNITY=${LIBRENMS_SNMP_COMMUNITY:-homelab}"

  # ---------------------------------------------------------------------------
  # LibreNMS Dispatcher: Scalable Polling Worker
  # ---------------------------------------------------------------------------
  dispatcher:
    image: librenms/librenms:latest
    container_name: librenms_dispatcher
    hostname: librenms-dispatcher
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "DISPATCHER_NODE_ID=dispatcher1"
      - "SIDECAR_DISPATCHER=1"

  # ---------------------------------------------------------------------------
  # LibreNMS Syslog-NG: Central Syslog Receiver (MikroTik, Proxmox, OpenWrt)
  # ---------------------------------------------------------------------------
  syslogng:
    image: librenms/librenms:latest
    container_name: librenms_syslogng
    hostname: librenms-syslogng
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    ports:
      - "${SYSLOG_PORT:-514}:514/tcp"
      - "${SYSLOG_PORT:-514}:514/udp"
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "SIDECAR_SYSLOGNG=1"

  # ---------------------------------------------------------------------------
  # LibreNMS SNMP Trapd: SNMP Trap Ingestion
  # ---------------------------------------------------------------------------
  snmptrapd:
    image: librenms/librenms:latest
    container_name: librenms_snmptrapd
    hostname: librenms-snmptrapd
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    ports:
      - "${SNMPTRAP_PORT:-162}:162/tcp"
      - "${SNMPTRAP_PORT:-162}:162/udp"
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "SIDECAR_SNMPTRAPD=1"

  # ---------------------------------------------------------------------------
  # Oxidized: Automated Configuration Backups & Git Versioning
  # ---------------------------------------------------------------------------
  oxidized:
    image: oxidized/oxidized:latest
    container_name: librenms_oxidized
    restart: always
    ports:
      - "8888:8888"
    environment:
      - "CONFIG_RELOAD_INTERVAL=600"
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    configs:
      - source: oxidized_config
        target: /etc/oxidized/config
      - source: oxidized_router_db
        target: /etc/oxidized/router.db
    volumes:
      - oxidized-data:/home/oxidized/.config/oxidized
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /home/oxidized/.config/oxidized &&
        cp /etc/oxidized/config /home/oxidized/.config/oxidized/config &&
        cp /etc/oxidized/router.db /home/oxidized/.config/oxidized/router.db &&
        chown -R oxidized:oxidized /home/oxidized/.config/oxidized &&
        exec gosu oxidized oxidized
    depends_on:
      - librenms

  # ---------------------------------------------------------------------------
  # Prometheus: Time-Series Metrics Scraper & Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "0:0"
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    configs:
      - source: prom_config
        target: /etc/prometheus/prometheus.yml
      - source: prom_alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus-data:/prometheus

  # ---------------------------------------------------------------------------
  # Grafana: Telemetry Dashboards & Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - "TZ=${TZ:-UTC}"
      - "GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}"
      - "GF_USERS_ALLOW_SIGN_UP=false"
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_prov
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dash_overview
        target: /etc/grafana/provisioning/dashboards/homelab-overview.json
      - source: grafana_dash_proxmox
        target: /etc/grafana/provisioning/dashboards/proxmox-cluster.json
      - source: grafana_dash_openwrt
        target: /etc/grafana/provisioning/dashboards/openwrt-wifi.json
      - source: grafana_dash_docker
        target: /etc/grafana/provisioning/dashboards/docker-host.json
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Trivy: Vulnerability & Security Scanner (Server Mode)
  # ---------------------------------------------------------------------------
  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    restart: always
    command:
      - "server"
      - "--listen"
      - "0.0.0.0:4954"
    ports:
      - "4954:4954"
    environment:
      - "TRIVY_CACHE_DIR=/root/.cache/trivy"
      - "TRIVY_DEBUG=${TRIVY_DEBUG:-false}"
    volumes:
      - trivy-cache:/root/.cache/

  # ---------------------------------------------------------------------------
  # Node Exporter: Docker Host Hardware & OS Telemetry
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  db-data:
  app-data:
  oxidized-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
  trivy-cache:

# -----------------------------------------------------------------------------
# Embedded Configurations (Self-Contained for Portainer Web Editor & Git)
# -----------------------------------------------------------------------------
configs:
  caddyfile:
    content: |
      {
      	# Global options
      	admin 0.0.0.0:2019
      	metrics
      }

      # Main Homelab Dashboard (Homepage)
      # Accepts apex domain or homelab/homepage subdomains (e.g. homelab.iye.internal or iye.internal)
      {$$DOMAIN:homelab.local}, homelab.{$$DOMAIN:homelab.local}, homepage.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy homepage:3000
      }

      # LibreNMS Web UI
      librenms.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy librenms:8000 {
      		header_up Host {host}
      		header_up X-Forwarded-Proto https
      	}
      }

      # Grafana Dashboards
      grafana.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy grafana:3000
      }

      # Prometheus Web UI & Metrics
      prometheus.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy prometheus:9090
      }

      # Oxidized Web UI & REST
      oxidized.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy oxidized:8888
      }

      # Trivy Security Scanner API
      trivy.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy trivy:4954
      }
  prom_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      rule_files:
        - "/etc/prometheus/alerts.yml"

      scrape_configs:
        # Prometheus Self-Monitoring
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]

        # Caddy Reverse Proxy & HTTP Metrics
        - job_name: "caddy"
          static_configs:
            - targets: ["homelab_caddy:2019"]

        # Docker Host (docker-homelab.iye.internal)
        - job_name: "docker-host"
          scrape_interval: 15s
          static_configs:
            - targets: ["node_exporter:9100"]
              labels:
                role: "docker-host"
                instance: "${PORTAINER_HOST:-docker-homelab.iye.internal}"

        # Proxmox VE Nodes (via node_exporter port 9100)
        - job_name: "proxmox"
          scrape_interval: 15s
          static_configs:
            - targets:
                - "${PROXMOX_NODE1_HOST:-virt-1.iye.internal}:9100"
                - "${PROXMOX_NODE2_HOST:-virt-2.iye.internal}:9100"
                - "${PROXMOX_NODE3_HOST:-virt-3.iye.internal}:9100"
              labels:
                role: "hypervisor"
                platform: "proxmox"

        # OpenWrt Access Points (via prometheus-node-exporter-lua on port 9100)
        - job_name: "openwrt"
          scrape_interval: 30s
          static_configs:
            - targets:
                - "${OPENWRT_AP1_HOST:-ap-outside.iye.internal}:9100"
                - "${OPENWRT_AP2_HOST:-ap-callie.iye.internal}:9100"
                - "${OPENWRT_AP3_HOST:-ap-robert.iye.internal}:9100"
                - "${OPENWRT_AP4_HOST:-ap-garage.iye.internal}:9100"
                - "${OPENWRT_AP5_HOST:-ap-printer.iye.internal}:9100"
                - "${OPENWRT_AP6_HOST:-ap-fort.iye.internal}:9100"
              labels:
                role: "access_point"
                vendor: "openwrt"

        # MikroTik Switches & Routers (RouterOS / SwOS)
        - job_name: "mikrotik"
          scrape_interval: 30s
          static_configs:
            - targets:
                # - "${MIKROTIK_CORE_HOST:-switch-1.iye.internal}"
                # - "${MIKROTIK_SW2_HOST:-switch-2.iye.internal}"
              labels:
                role: "switch"
                vendor: "mikrotik"
  prom_alerts:
    content: |
      groups:
        - name: homelab-alerts
          rules:
            - alert: InstanceDown
              expr: up == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Instance {{ $$labels.instance }} is down"
                description: "{{ $$labels.job }} target {{ $$labels.instance }} has been unreachable for more than 2 minutes."

            - alert: HighCpuUsage
              expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High CPU usage on {{ $$labels.instance }}"
                description: "CPU load on {{ $$labels.instance }} is above 90% for over 5 minutes."

            - alert: HighMemoryUsage
              expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High Memory usage on {{ $$labels.instance }}"
                description: "Memory usage on {{ $$labels.instance }} is above 90% for over 5 minutes."

            - alert: LowDiskSpace
              expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Low disk space on {{ $$labels.instance }}"
                description: "Root partition on {{ $$labels.instance }} has less than 10% available space."
  homepage_settings:
    content: |
      ---
      # Homepage General Settings
      # Reference: https://gethomepage.dev/configs/settings/

      title: "Homelab Operations Hub"
      theme: dark
      color: slate
      headerStyle: clean
      cardBlur: md
      target: _blank

      layout:
        Network & Monitoring:
          style: row
          columns: 4
        Virtualization & Servers:
          style: row
          columns: 4
        Network Switches (MikroTik):
          style: row
          columns: 3
        Wireless Access Points (OpenWrt):
          style: row
          columns: 3
        Security & Operations:
          style: row
          columns: 2
  homepage_services:
    content: |
      ---
      # Homepage Services Configuration
      # Reference: https://gethomepage.dev/configs/services/

      - Network & Monitoring:
          - LibreNMS:
              icon: librenms
              href: https://librenms.${DOMAIN:-iye.internal}
              description: Central SNMP Monitoring & Discovery
              server: my-docker
              container: librenms
          - Oxidized:
              icon: oxidized
              href: https://oxidized.${DOMAIN:-iye.internal}
              description: Automated RouterOS & OpenWrt Git Backups
              server: my-docker
              container: librenms_oxidized
          - Grafana:
              icon: grafana
              href: https://grafana.${DOMAIN:-iye.internal}
              description: Telemetry Dashboards & Visualization
              server: my-docker
              container: grafana
          - Prometheus:
              icon: prometheus
              href: https://prometheus.${DOMAIN:-iye.internal}
              description: Time-Series Metrics & Alerting Engine
              server: my-docker
              container: prometheus

      - Virtualization & Servers:
          - Proxmox PVE 1:
              icon: proxmox
              href: https://${PROXMOX_NODE1_HOST:-virt-1.iye.internal}:8006
              description: Proxmox Hypervisor Node 1 (virt-1)
          - Proxmox PVE 2:
              icon: proxmox
              href: https://${PROXMOX_NODE2_HOST:-virt-2.iye.internal}:8006
              description: Proxmox Hypervisor Node 2 (virt-2)
          - Proxmox PVE 3:
              icon: proxmox
              href: https://${PROXMOX_NODE3_HOST:-virt-3.iye.internal}:8006
              description: Proxmox Hypervisor Node 3 (virt-3)
          - Portainer:
              icon: portainer
              href: https://${PORTAINER_HOST:-docker-homelab.iye.internal}:9443
              description: Docker & Stack Management

      - Network Switches (MikroTik):
          - MikroTik Switch 1:
              icon: mikrotik
              href: http://${MIKROTIK_CORE_HOST:-switch-1.iye.internal}
              description: Core Switch 1 (RouterOS / WebFig)
          - MikroTik Switch 2:
              icon: mikrotik
              href: http://${MIKROTIK_SW2_HOST:-switch-2.iye.internal}
              description: Switch 2 (RouterOS / WebFig)

      - Wireless Access Points (OpenWrt):
          - OpenWrt Outside AP:
              icon: openwrt
              href: http://${OPENWRT_AP1_HOST:-ap-outside.iye.internal}
              description: Outside AP (LuCI)
          - OpenWrt Callie AP:
              icon: openwrt
              href: http://${OPENWRT_AP2_HOST:-ap-callie.iye.internal}
              description: Callie AP (LuCI)
          - OpenWrt Robert AP:
              icon: openwrt
              href: http://${OPENWRT_AP3_HOST:-ap-robert.iye.internal}
              description: Robert AP (LuCI)
          - OpenWrt Garage AP:
              icon: openwrt
              href: http://${OPENWRT_AP4_HOST:-ap-garage.iye.internal}
              description: Garage AP (LuCI)
          - OpenWrt Printer AP:
              icon: openwrt
              href: http://${OPENWRT_AP5_HOST:-ap-printer.iye.internal}
              description: Printer AP (LuCI)
          - OpenWrt Fort AP:
              icon: openwrt
              href: http://${OPENWRT_AP6_HOST:-ap-fort.iye.internal}
              description: Fort AP (LuCI)

      - Security & Operations:
          - Caddy:
              icon: caddy
              href: https://${DOMAIN:-iye.internal}
              description: Ingress Gateway & TLS Reverse Proxy
              server: my-docker
              container: homelab_caddy
          - Trivy:
              icon: trivy
              href: https://trivy.${DOMAIN:-iye.internal}
              description: Container & Filesystem Vulnerability Scanner
              server: my-docker
              container: trivy
  homepage_widgets:
    content: |
      ---
      # Homepage Header Widgets
      # Reference: https://gethomepage.dev/configs/info-widgets/

      - datetime:
          text_size: xl
          format:
            timeStyle: short
            dateStyle: medium
            hour12: true

      - resources:
          cpu: true
          memory: true
          disk: /

      - search:
          provider: duckduckgo
          target: _blank
  homepage_bookmarks:
    content: |
      ---
      # Homepage Bookmarks Configuration
      # Reference: https://gethomepage.dev/configs/bookmarks/

      - Homelab Documentation:
          - MikroTik Docs:
              - icon: mikrotik
                href: https://help.mikrotik.com/docs/
          - Proxmox VE Wiki:
              - icon: proxmox
                href: https://pve.proxmox.com/wiki/Main_Page
          - OpenWrt Guide:
              - icon: openwrt
                href: https://openwrt.org/docs/start
          - LibreNMS Docs:
              - icon: librenms
                href: https://docs.librenms.org/
  homepage_docker:
    content: |
      ---
      # Docker Integration Configuration
      # Reference: https://gethomepage.dev/configs/docker/

      my-docker:
        socket: /var/run/docker.sock
  oxidized_config:
    content: |
      ---
      # Global default SSH credentials
      username: ${OXIDIZED_GLOBAL_USER:-root}
      password: ${OXIDIZED_GLOBAL_PASSWORD:-v01c3l@bNOW}
      model: routeros
      resolve_dns: true
      interval: 3600
      use_syslog: false
      debug: false
      threads: 30
      timeout: 20
      retries: 3
      prompt: !ruby/regexp /^([\w.@-]+[#>]\s?)$$/
      rest: 0.0.0.0:8888

      # Model-specific credentials and configurations
      models:
        # MikroTik RouterOS Switches / Routers
        routeros:
          username: ${OXIDIZED_ROUTEROS_USER:-admin}
          password: ${OXIDIZED_ROUTEROS_PASSWORD:-v01c3l@bNOW}
          # vars:
          #   ssh_keys: /home/oxidized/.config/oxidized/id_rsa

        # OpenWrt Access Points / Routers
        openwrt:
          username: ${OXIDIZED_OPENWRT_USER:-root}
          password: ${OXIDIZED_OPENWRT_PASSWORD:-v01c3l@bNOW}
          vars:
            openwrt_binary_files:
              - /etc/dropbear/dropbear_rsa_host_key
              - /etc/dropbear/dropbear_ed25519_host_key
              - /etc/dropbear/dropbear_ecdsa_host_key
              - /etc/dropbear/dropbear_dss_host_key
              - /etc/uhttpd.crt
              - /etc/uhttpd.key
          # vars:
          #   ssh_keys: /home/oxidized/.config/oxidized/id_rsa

      pid: "/home/oxidized/.config/oxidized/pid"
      crash:
        directory: "/home/oxidized/.config/oxidized/crashes"
        hostnames: false

      stats:
        history_size: 20

      input:
        default: ssh, telnet
        debug: false
        ssh:
          secure: false
        utf8_encoded: true

      output:
        default: git
        file:
          directory: "/home/oxidized/.config/oxidized/configs"
        git:
          user: Oxidized
          email: oxidized@homelab.local
          repo: "/home/oxidized/.config/oxidized/oxidized.git"

      source:
        default: ${OXIDIZED_SOURCE:-http}
        csv:
          file: "/home/oxidized/.config/oxidized/router.db"
          delimiter: !ruby/regexp /:/
          map:
            name: 0
            model: 1
            group: 2
        # Optional: Dynamic inventory via LibreNMS API (generate token under LibreNMS -> Settings -> API Access)
        http:
          insecure: true
          url: http://librenms:8000/api/v0/oxidized
          map:
            name: hostname
            model: os
            group: group
          headers:
            X-Auth-Token: "${LIBRENMS_API_TOKEN:-vOo3rNBCUvRpzuDolU0G0zMqiOgBZemaEliwVQw50627347a}"
