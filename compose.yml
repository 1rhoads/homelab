          </div>

          <p>
            This is the centralized <strong>Trivy Vulnerability &amp; Security Scanner Server</strong> for the homelab.
            It runs in headless server/RPC mode to perform vulnerability, misconfiguration, and secret scanning for container images, git repositories, and filesystems.
