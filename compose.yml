services:
  # ---------------------------------------------------------------------------
  # Caddy: Ingress Gateway & Reverse Proxy with Automatic Internal TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: homelab_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - "DOMAIN=${DOMAIN:-iye.internal}"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  # ---------------------------------------------------------------------------
  # Homepage: Modern, Highly Customizable Homelab Application Dashboard
  # ---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    ports:
      - "3001:3000"
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "HOMEPAGE_VAR_DOMAIN=${DOMAIN:-iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE1_HOST=${PROXMOX_NODE1_HOST:-pve1.iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE2_HOST=${PROXMOX_NODE2_HOST:-pve2.iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE3_HOST=${PROXMOX_NODE3_HOST:-pve3.iye.internal}"
      - "HOMEPAGE_VAR_PORTAINER_HOST=${PORTAINER_HOST:-portainer.iye.internal}"
      - "HOMEPAGE_VAR_MIKROTIK_CORE_HOST=${MIKROTIK_CORE_HOST:-sw-core.iye.internal}"
      - "HOMEPAGE_VAR_MIKROTIK_SW2_HOST=${MIKROTIK_SW2_HOST:-sw-poe.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP1_HOST=${OPENWRT_AP1_HOST:-ap-livingroom.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP2_HOST=${OPENWRT_AP2_HOST:-ap-office.iye.internal}"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------------------
  # MariaDB: Backend Database for LibreNMS
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: librenms_db
    restart: always
    command:
      - "mysqld"
      - "--innodb-file-per-table=1"
      - "--lower-case-table-names=0"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - "TZ=${TZ:-UTC}"
      - "MARIADB_RANDOM_ROOT_PASSWORD=yes"
      - "MYSQL_DATABASE=${MYSQL_DATABASE:-librenms}"
      - "MYSQL_USER=${MYSQL_USER:-librenms}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD:-librenms}"

  # ---------------------------------------------------------------------------
  # Redis: In-Memory Cache and Queue for LibreNMS
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: librenms_redis
    restart: always
    environment:
      - "TZ=${TZ:-UTC}"

  # ---------------------------------------------------------------------------
  # msmtpd: Outbound Mail Relay for Alerting
  # ---------------------------------------------------------------------------
  msmtpd:
    image: crazymax/msmtpd:latest
    container_name: librenms_msmtpd
    restart: always
    environment:
      - "TZ=${TZ:-UTC}"
      - "SMTP_HOST=${SMTP_HOST:-localhost}"
      - "SMTP_PORT=${SMTP_PORT:-25}"
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false

  # ---------------------------------------------------------------------------
  # LibreNMS: Core Network Monitoring System
  # ---------------------------------------------------------------------------
  librenms:
    image: librenms/librenms:latest
    container_name: librenms
    hostname: librenms
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "3300:8000"
    depends_on:
      - db
      - redis
      - msmtpd
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "LIBRENMS_BASE_URL=${LIBRENMS_BASE_URL:-/}"
      - "LIBRENMS_SNMP_COMMUNITY=${LIBRENMS_SNMP_COMMUNITY:-homelab}"

  # ---------------------------------------------------------------------------
  # LibreNMS Dispatcher: Scalable Polling Worker
  # ---------------------------------------------------------------------------
  dispatcher:
    image: librenms/librenms:latest
    container_name: librenms_dispatcher
    hostname: librenms-dispatcher
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "DISPATCHER_NODE_ID=dispatcher1"
      - "SIDECAR_DISPATCHER=1"

  # ---------------------------------------------------------------------------
  # LibreNMS Syslog-NG: Central Syslog Receiver (MikroTik, Proxmox, OpenWrt)
  # ---------------------------------------------------------------------------
  syslogng:
    image: librenms/librenms:latest
    container_name: librenms_syslogng
    hostname: librenms-syslogng
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    ports:
      - "${SYSLOG_PORT:-514}:514/tcp"
      - "${SYSLOG_PORT:-514}:514/udp"
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "SIDECAR_SYSLOGNG=1"

  # ---------------------------------------------------------------------------
  # LibreNMS SNMP Trapd: SNMP Trap Ingestion
  # ---------------------------------------------------------------------------
  snmptrapd:
    image: librenms/librenms:latest
    container_name: librenms_snmptrapd
    hostname: librenms-snmptrapd
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    ports:
      - "${SNMPTRAP_PORT:-162}:162/tcp"
      - "${SNMPTRAP_PORT:-162}:162/udp"
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "SIDECAR_SNMPTRAPD=1"

  # ---------------------------------------------------------------------------
  # Oxidized: Automated Configuration Backups & Git Versioning
  # ---------------------------------------------------------------------------
  oxidized:
    image: oxidized/oxidized:latest
    container_name: librenms_oxidized
    restart: always
    ports:
      - "8888:8888"
    environment:
      - "CONFIG_RELOAD_INTERVAL=600"
      - "OXIDIZED_HOME=/etc/oxidized"
    volumes:
      - oxidized-data:/home/oxidized/.config/oxidized
      - ./oxidized:/etc/oxidized:ro
    depends_on:
      - librenms

  # ---------------------------------------------------------------------------
  # Prometheus: Time-Series Metrics Scraper & Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "0:0"
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  # ---------------------------------------------------------------------------
  # Grafana: Telemetry Dashboards & Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - "TZ=${TZ:-UTC}"
      - "GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}"
      - "GF_USERS_ALLOW_SIGN_UP=false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Trivy: Vulnerability & Security Scanner (Server Mode)
  # ---------------------------------------------------------------------------
  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    restart: always
    command:
      - "server"
      - "--listen"
      - "0.0.0.0:4954"
    ports:
      - "4954:4954"
    environment:
      - "TRIVY_CACHE_DIR=/root/.cache/trivy"
      - "TRIVY_DEBUG=${TRIVY_DEBUG:-false}"
    volumes:
      - trivy-cache:/root/.cache/

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  db-data:
  app-data:
  oxidized-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
  trivy-cache:
