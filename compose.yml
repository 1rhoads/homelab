services:
  # ---------------------------------------------------------------------------
  # Caddy: Ingress Gateway & Reverse Proxy with Automatic Internal TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    pull_policy: always
    container_name: homelab_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - "DOMAIN=${DOMAIN:-iye.internal}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
      - source: trivy_landing
        target: /srv/trivy/index.html
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # ---------------------------------------------------------------------------
  # Homepage: Modern, Highly Customizable Homelab Application Dashboard
  # ---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    pull_policy: always
    container_name: homepage
    restart: always
    ports:
      - "3001:3000"
    environment:
      - "TZ=${TZ:-UTC}"
      - "HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-*}"
      - "HOMEPAGE_VAR_DOMAIN=${DOMAIN:-iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE1_HOST=${PROXMOX_NODE1_HOST:-pve1.iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE2_HOST=${PROXMOX_NODE2_HOST:-pve2.iye.internal}"
      - "HOMEPAGE_VAR_PROXMOX_NODE3_HOST=${PROXMOX_NODE3_HOST:-pve3.iye.internal}"
      - "HOMEPAGE_VAR_PORTAINER_HOST=${PORTAINER_HOST:-portainer.iye.internal}"
      - "HOMEPAGE_VAR_MIKROTIK_CORE_HOST=${MIKROTIK_CORE_HOST:-sw-core.iye.internal}"
      - "HOMEPAGE_VAR_MIKROTIK_SW2_HOST=${MIKROTIK_SW2_HOST:-sw-poe.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP1_HOST=${OPENWRT_AP1_HOST:-ap-outside.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP2_HOST=${OPENWRT_AP2_HOST:-ap-callie.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP3_HOST=${OPENWRT_AP3_HOST:-ap-robert.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP4_HOST=${OPENWRT_AP4_HOST:-ap-garage.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP5_HOST=${OPENWRT_AP5_HOST:-ap-printer.iye.internal}"
      - "HOMEPAGE_VAR_OPENWRT_AP6_HOST=${OPENWRT_AP6_HOST:-ap-fort.iye.internal}"
    configs:
      - source: homepage_settings
        target: /app/config/settings.yaml
      - source: homepage_services
        target: /app/config/services.yaml
      - source: homepage_widgets
        target: /app/config/widgets.yaml
      - source: homepage_bookmarks
        target: /app/config/bookmarks.yaml
      - source: homepage_docker
        target: /app/config/docker.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------------------
  # MariaDB: Backend Database for LibreNMS
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: librenms_db
    restart: always
    command:
      - "mysqld"
      - "--innodb-file-per-table=1"
      - "--lower-case-table-names=0"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - "TZ=${TZ:-UTC}"
      - "MARIADB_RANDOM_ROOT_PASSWORD=yes"
      - "MYSQL_DATABASE=${MYSQL_DATABASE:-librenms}"
      - "MYSQL_USER=${MYSQL_USER:-librenms}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD:-librenms}"

  # ---------------------------------------------------------------------------
  # Redis: In-Memory Cache and Queue for LibreNMS
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    pull_policy: always
    container_name: librenms_redis
    restart: always
    environment:
      - "TZ=${TZ:-UTC}"

  # ---------------------------------------------------------------------------
  # msmtpd: Outbound Mail Relay for Alerting
  # ---------------------------------------------------------------------------
  msmtpd:
    image: crazymax/msmtpd:latest
    pull_policy: always
    container_name: librenms_msmtpd
    restart: always
    environment:
      - "TZ=${TZ:-UTC}"
      - "SMTP_HOST=${SMTP_HOST:-localhost}"
      - "SMTP_PORT=${SMTP_PORT:-25}"
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false

  # ---------------------------------------------------------------------------
  # LibreNMS: Core Network Monitoring System
  # ---------------------------------------------------------------------------
  librenms:
    image: librenms/librenms:latest
    pull_policy: always
    container_name: librenms
    hostname: librenms
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "3300:8000"
    depends_on:
      - db
      - redis
      - msmtpd
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "LIBRENMS_BASE_URL=${LIBRENMS_BASE_URL:-https://librenms.${DOMAIN:-iye.internal}}"
      - "APP_URL=https://librenms.${DOMAIN:-iye.internal}"
      - "APP_TRUSTED_PROXIES=*"
      - "LIBRENMS_SNMP_COMMUNITY=${LIBRENMS_SNMP_COMMUNITY:-homelab}"

  # ---------------------------------------------------------------------------
  # LibreNMS Dispatcher: Scalable Polling Worker
  # ---------------------------------------------------------------------------
  dispatcher:
    image: librenms/librenms:latest
    pull_policy: always
    container_name: librenms_dispatcher
    hostname: librenms-dispatcher
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "DISPATCHER_NODE_ID=dispatcher1"
      - "SIDECAR_DISPATCHER=1"

  # ---------------------------------------------------------------------------
  # LibreNMS Syslog-NG: Central Syslog Receiver (MikroTik, Proxmox, OpenWrt)
  # ---------------------------------------------------------------------------
  syslogng:
    image: librenms/librenms:latest
    pull_policy: always
    container_name: librenms_syslogng
    hostname: librenms-syslogng
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    ports:
      - "${SYSLOG_PORT:-514}:514/tcp"
      - "${SYSLOG_PORT:-514}:514/udp"
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "SIDECAR_SYSLOGNG=1"

  # ---------------------------------------------------------------------------
  # LibreNMS SNMP Trapd: SNMP Trap Ingestion
  # ---------------------------------------------------------------------------
  snmptrapd:
    image: librenms/librenms:latest
    pull_policy: always
    container_name: librenms_snmptrapd
    hostname: librenms-snmptrapd
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - librenms
      - redis
    ports:
      - "${SNMPTRAP_PORT:-162}:162/tcp"
      - "${SNMPTRAP_PORT:-162}:162/udp"
    volumes:
      - app-data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      - "TZ=${TZ:-UTC}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "DB_HOST=db"
      - "DB_NAME=${MYSQL_DATABASE:-librenms}"
      - "DB_USER=${MYSQL_USER:-librenms}"
      - "DB_PASSWORD=${MYSQL_PASSWORD:-librenms}"
      - "DB_TIMEOUT=60"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "SIDECAR_SNMPTRAPD=1"

  # ---------------------------------------------------------------------------
  # Oxidized: Automated Configuration Backups & Git Versioning
  # ---------------------------------------------------------------------------
  oxidized:
    image: oxidized/oxidized:latest
    pull_policy: always
    container_name: librenms_oxidized
    restart: always
    ports:
      - "8888:8888"
    environment:
      - "CONFIG_RELOAD_INTERVAL=600"
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    configs:
      - source: oxidized_config
        target: /etc/oxidized/config
      - source: oxidized_router_db
        target: /etc/oxidized/router.db
    volumes:
      - oxidized-data:/home/oxidized/.config/oxidized
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /home/oxidized/.config/oxidized &&
        cp /etc/oxidized/config /home/oxidized/.config/oxidized/config &&
        cp /etc/oxidized/router.db /home/oxidized/.config/oxidized/router.db &&
        chown -R oxidized:oxidized /home/oxidized/.config/oxidized &&
        exec gosu oxidized oxidized
    depends_on:
      - librenms

  # ---------------------------------------------------------------------------
  # Prometheus: Time-Series Metrics Scraper & Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    pull_policy: always
    container_name: prometheus
    user: "0:0"
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    configs:
      - source: prom_config
        target: /etc/prometheus/prometheus.yml
      - source: prom_alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus-data:/prometheus

  # ---------------------------------------------------------------------------
  # Grafana: Telemetry Dashboards & Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    pull_policy: always
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - "TZ=${TZ:-UTC}"
      - "GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}"
      - "GF_USERS_ALLOW_SIGN_UP=false"
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_prov
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dash_overview
        target: /etc/grafana/provisioning/dashboards/homelab-overview.json
      - source: grafana_dash_proxmox
        target: /etc/grafana/provisioning/dashboards/proxmox-cluster.json
      - source: grafana_dash_openwrt
        target: /etc/grafana/provisioning/dashboards/openwrt-wifi.json
      - source: grafana_dash_docker
        target: /etc/grafana/provisioning/dashboards/docker-host.json
      - source: grafana_dash_security
        target: /etc/grafana/provisioning/dashboards/trivy-security.json
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Trivy: Vulnerability & Security Scanner (Server Mode)
  # ---------------------------------------------------------------------------
  trivy:
    image: aquasec/trivy:latest
    pull_policy: always
    container_name: trivy
    restart: always
    command:
      - "server"
      - "--listen"
      - "0.0.0.0:4954"
    ports:
      - "4954:4954"
    environment:
      - "TRIVY_CACHE_DIR=/root/.cache/trivy"
      - "TRIVY_DEBUG=${TRIVY_DEBUG:-false}"
    volumes:
      - trivy-cache:/root/.cache/

  # ---------------------------------------------------------------------------
  # Trivy Exporter: Container Vulnerability Scanner & Telemetry Exporter
  # ---------------------------------------------------------------------------
  trivy-exporter:
    image: aquasec/trivy:latest
    pull_policy: always
    container_name: trivy_exporter
    restart: always
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache python3 >/dev/null 2>&1 && exec python3 /app/exporter.py"]
    ports:
      - "9091:9091"
    environment:
      - "TRIVY_SERVER_URL=http://trivy:4954"
      - "LISTEN_PORT=9091"
      - "SCAN_INTERVAL_SECONDS=21600"
      - "SCAN_ON_STARTUP=true"
      - "DOCKER_SOCKET=/var/run/docker.sock"
    configs:
      - source: trivy_exporter_script
        target: /app/exporter.py
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/
    depends_on:
      - trivy

  # ---------------------------------------------------------------------------
  # Ansible Semaphore: Web UI & Automation Control Plane
  # ---------------------------------------------------------------------------
  semaphore:
    image: semaphoreui/semaphore:latest
    pull_policy: always
    container_name: semaphore
    restart: always
    ports:
      - "3002:3000"
    environment:
      - "TZ=${TZ:-UTC}"
      - "SEMAPHORE_DB_DIALECT=sqlite"
      - "SEMAPHORE_DB_PATH=/etc/semaphore/semaphore.db"
      - "SEMAPHORE_ADMIN=${SEMAPHORE_ADMIN_USER:-admin}"
      - "SEMAPHORE_ADMIN_PASSWORD=${SEMAPHORE_ADMIN_PASSWORD:-v01c3l@bNOW}"
      - "SEMAPHORE_ADMIN_NAME=Homelab Admin"
      - "SEMAPHORE_ADMIN_EMAIL=admin@${DOMAIN:-iye.internal}"
      - "SEMAPHORE_PLAYBOOK_PATH=/tmp/semaphore"
      - "SEMAPHORE_ACCESS_KEY_ENCRYPTION=${SEMAPHORE_ACCESS_KEY_ENCRYPTION:-a8f7c9e1b2d45678a9c0e2f4b6d81012}"
    volumes:
      - semaphore-data:/etc/semaphore

  # ---------------------------------------------------------------------------
  # Node Exporter: Docker Host Hardware & OS Telemetry
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    pull_policy: always
    container_name: node_exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # ---------------------------------------------------------------------------
  # NetBox: IPAM & DCIM Source of Truth (PostgreSQL Database)
  # ---------------------------------------------------------------------------
  netbox_db:
    image: postgres:16-alpine
    container_name: netbox_db
    restart: always
    environment:
      - "TZ=${TZ:-UTC}"
      - "POSTGRES_DB=${NETBOX_DB_NAME:-netbox}"
      - "POSTGRES_USER=${NETBOX_DB_USER:-netbox}"
      - "POSTGRES_PASSWORD=${NETBOX_DB_PASSWORD:-v01c3l@bNOW}"
    volumes:
      - netbox-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NETBOX_DB_USER:-netbox} -d ${NETBOX_DB_NAME:-netbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NetBox: Task Broker & In-Memory Cache (Redis)
  # ---------------------------------------------------------------------------
  netbox_redis:
    image: redis:7-alpine
    pull_policy: always
    container_name: netbox_redis
    restart: always
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    volumes:
      - netbox-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # NetBox: IPAM & DCIM Application Core (Web UI & REST API)
  # ---------------------------------------------------------------------------
  netbox:
    image: netboxcommunity/netbox:latest
    pull_policy: always
    container_name: netbox
    restart: always
    depends_on:
      netbox_db:
        condition: service_healthy
      netbox_redis:
        condition: service_healthy
    environment:
      - "TZ=${TZ:-UTC}"
      - "DB_HOST=netbox_db"
      - "DB_PORT=5432"
      - "DB_NAME=${NETBOX_DB_NAME:-netbox}"
      - "DB_USER=${NETBOX_DB_USER:-netbox}"
      - "DB_PASSWORD=${NETBOX_DB_PASSWORD:-v01c3l@bNOW}"
      - "REDIS_HOST=netbox_redis"
      - "REDIS_PORT=6379"
      - "REDIS_DATABASE=0"
      - "REDIS_CACHE_HOST=netbox_redis"
      - "REDIS_CACHE_PORT=6379"
      - "REDIS_CACHE_DATABASE=1"
      - "SECRET_KEY=${NETBOX_SECRET_KEY:-f79a941e411b0e352011d6199d7994017efaa36eb78c94294b0d0c8d19bf9e6a}"
      - "ALLOWED_HOSTS=* netbox.${DOMAIN:-iye.internal} netbox localhost 127.0.0.1 docker-homelab.iye.internal"
      - "CSRF_TRUSTED_ORIGINS=https://netbox.${DOMAIN:-iye.internal} http://netbox.${DOMAIN:-iye.internal} https://netbox.homelab.local http://netbox:8080"
      - "METRICS_ENABLED=true"
      - "SUPERUSER_NAME=${NETBOX_SUPERUSER_NAME:-admin}"
      - "SUPERUSER_EMAIL=${NETBOX_SUPERUSER_EMAIL:-admin@iye.internal}"
      - "SUPERUSER_PASSWORD=${NETBOX_SUPERUSER_PASSWORD:-v01c3l@bNOW}"
      - "SUPERUSER_API_TOKEN=${NETBOX_API_TOKEN:-0123456789abcdef0123456789abcdef01234567}"
      - "SKIP_SUPERUSER=false"
      - "CORS_ORIGIN_ALLOW_ALL=True"
    volumes:
      - netbox-media-data:/opt/netbox/netbox/media
      - netbox-reports-data:/opt/netbox/netbox/reports
      - netbox-scripts-data:/opt/netbox/netbox/scripts
    healthcheck:
      test: /opt/netbox/health.sh
      start_period: 90s
      timeout: 5s
      interval: 15s

  # ---------------------------------------------------------------------------
  # NetBox Worker: Background Redis Queue (RQ) Processor
  # ---------------------------------------------------------------------------
  netbox_worker:
    image: netboxcommunity/netbox:latest
    pull_policy: always
    container_name: netbox_worker
    restart: always
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - "/opt/netbox/venv/bin/python"
      - "/opt/netbox/netbox/manage.py"
      - "rqworker"
    environment:
      - "TZ=${TZ:-UTC}"
      - "DB_HOST=netbox_db"
      - "DB_PORT=5432"
      - "DB_NAME=${NETBOX_DB_NAME:-netbox}"
      - "DB_USER=${NETBOX_DB_USER:-netbox}"
      - "DB_PASSWORD=${NETBOX_DB_PASSWORD:-v01c3l@bNOW}"
      - "REDIS_HOST=netbox_redis"
      - "REDIS_PORT=6379"
      - "REDIS_DATABASE=0"
      - "REDIS_CACHE_HOST=netbox_redis"
      - "REDIS_CACHE_PORT=6379"
      - "REDIS_CACHE_DATABASE=1"
      - "SECRET_KEY=${NETBOX_SECRET_KEY:-f79a941e411b0e352011d6199d7994017efaa36eb78c94294b0d0c8d19bf9e6a}"
      - "ALLOWED_HOSTS=*"
    volumes:
      - netbox-media-data:/opt/netbox/netbox/media:ro
      - netbox-reports-data:/opt/netbox/netbox/reports
      - netbox-scripts-data:/opt/netbox/netbox/scripts

# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  db-data:
  app-data:
  oxidized-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
  trivy-cache:
  netbox-db-data:
  netbox-redis-data:
  netbox-media-data:
  netbox-reports-data:
  netbox-scripts-data:
  semaphore-data:

# -----------------------------------------------------------------------------
# Embedded Configurations (Self-Contained for Portainer Web Editor & Git)
# -----------------------------------------------------------------------------
configs:
  caddyfile:
    content: |
      {
      	# Global options
      	admin 0.0.0.0:2019
      	metrics
      }

      # Main Homelab Dashboard (Homepage)
      # Accepts apex domain or homelab/homepage subdomains (e.g. homelab.iye.internal or iye.internal)
      {$$DOMAIN:homelab.local}, homelab.{$$DOMAIN:homelab.local}, homepage.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy homepage:3000
      }

      # LibreNMS Web UI
      librenms.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy librenms:8000 {
      		header_up Host {host}
      		header_up X-Forwarded-Proto https
      	}
      }

      # Grafana Dashboards
      grafana.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy grafana:3000
      }

      # Prometheus Web UI & Metrics
      prometheus.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy prometheus:9090
      }

      # Oxidized Web UI & REST
      oxidized.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy oxidized:8888
      }

      # Trivy Security Scanner API
      trivy.{$$DOMAIN:homelab.local} {
      	tls internal

      	@root path /
      	handle @root {
      		root * /srv/trivy
      		file_server
      	}

      	handle {
      		reverse_proxy trivy:4954
      	}
      }

      # NetBox IPAM & DCIM
      netbox.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy netbox:8080
      }

      # Ansible Semaphore Automation Web UI
      semaphore.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy semaphore:3000
      }

      # HomeGlow Smart Home & Family Dashboard
      homeglow.{$$DOMAIN:homelab.local} {
      	tls internal
      	reverse_proxy homeglow-frontend:3000
      }
  trivy_landing:
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trivy Security Scanner | Homelab</title>
        <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
          }
          .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            max-width: 680px;
            width: 100%;
            padding: 2.25rem;
