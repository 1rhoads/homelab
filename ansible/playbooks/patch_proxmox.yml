---
# ==============================================================================
# Playbook: Proxmox VE Rolling Cluster Patch & Quorum-Safe Reboot
# ==============================================================================
- name: Patch Proxmox VE Nodes (Rolling 1-by-1)
  hosts: proxmox
  serial: 1
  become: true
  gather_facts: true

  tasks:
    - name: Verify Proxmox cluster quorum before proceeding
      ansible.builtin.command: pvecm status
      register: quorum_check
      changed_when: false

    - name: Assert cluster is quorate before patching
      ansible.builtin.assert:
        that: quorum_check.stdout is search('Quorate:\s+Yes')
        fail_msg: "Cluster is not quorate on {{ inventory_hostname }}; refusing to patch."
        success_msg: "Node {{ inventory_hostname }} is part of active cluster. Quorum verified."

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 300

    - name: Perform full dist-upgrade for Proxmox VE packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: apt_upgrade

    - name: Check if node reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Check running kernel vs latest installed kernel
      ansible.builtin.shell: |
        RUNNING=$(uname -r)
        LATEST=$(ls -1 /boot/vmlinuz-* 2>/dev/null | sed 's/.*vmlinuz-//' | sort -V | tail -n 1)
        if [ "$RUNNING" != "$LATEST" ] && [ -n "$LATEST" ]; then
          echo "kernel_upgrade_needed"
        fi
      register: kernel_check
      changed_when: false

    - name: Reboot node if required by updates or kernel upgrade
      when: reboot_required_file.stat.exists or 'kernel_upgrade_needed' in kernel_check.stdout
      block:
        - name: Rebooting Proxmox node {{ inventory_hostname }}
          ansible.builtin.reboot:
            msg: "Ansible automated patching initiated reboot for {{ inventory_hostname }}"
            connect_timeout: 15
            reboot_timeout: 600
            pre_reboot_delay: 5
            post_reboot_delay: 30
            test_command: pvecm status

        - name: Verify cluster quorum has re-established
          ansible.builtin.command: pvecm status
          register: post_reboot_quorum
          until: post_reboot_quorum.rc == 0 and post_reboot_quorum.stdout is search('Quorate:\s+Yes')
          retries: 15
          delay: 10
          changed_when: false

    - name: Display patch summary for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "Successfully patched {{ inventory_hostname }}. Upgrades applied: {{ apt_upgrade.changed }}."
