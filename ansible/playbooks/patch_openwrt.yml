---
# ==============================================================================
# Playbook: OpenWrt Attended Sysupgrade (Rolling 1-by-1 with Client Verification)
# ==============================================================================
- name: OpenWrt Attended Sysupgrade (Rolling 1-by-1 with Client Verification)
  hosts: openwrt
  serial: 1 # Strictly upgrade and verify one access point at a time
  gather_facts: false

  vars:
    # Set to true to execute actual sysupgrade (defaults to false for safe audit / check)
    perform_sysupgrade: false
    # Backwards compatibility: if upgrade_packages was configured in Semaphore, honor it as well
    upgrade_packages: false
    # Client verification settings
    min_reconnected_clients: 1 # Minimum clients required to reconnect before next AP
    reconnect_timeout_seconds: 180 # Maximum seconds to wait for client reconnection
    reconnect_poll_interval: 10 # Seconds between retry checks
    skip_reconnect_check_if_empty: true # If AP had 0 clients before upgrade, don't stall waiting for clients

  tasks:
    # --------------------------------------------------------------------------
    # 1. PRE-UPGRADE: Check Connected Client Devices
    # --------------------------------------------------------------------------
    - name: Query connected wireless clients before upgrade
      ansible.builtin.raw: |
        for iface in $(cat /etc/librenms/wlInterfaces.txt 2>/dev/null | cut -f1 -d',' || ubus list 'hostapd.*' 2>/dev/null | sed 's/hostapd\.//'); do
          iwinfo "$iface" assoclist 2>/dev/null | grep -E '^[0-9A-Fa-f]{2}:' | awk -v i="$iface" '{print i " | " $1 " | signal: " $2 " " $3}'
        done
      register: clients_before_raw
      changed_when: false
      check_mode: false

    - name: Parse pre-upgrade client list
      ansible.builtin.set_fact:
        clients_before: "{{ clients_before_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list }}"
        client_count_before: "{{ (clients_before_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list) | length }}"

    - name: Determine required post-upgrade client threshold
      ansible.builtin.set_fact:
        target_reconnect_clients: "{{ 0 if (skip_reconnect_check_if_empty | bool and client_count_before | int == 0) else (min_reconnected_clients | int) }}"
        ap_was_upgraded: false

    # --------------------------------------------------------------------------
    # 2. CHECK ATTENDED SYSUPGRADE (ASU / OWUT)
    # --------------------------------------------------------------------------
    - name: Query Attended Sysupgrade status via owut
      ansible.builtin.raw: |
        OUT=$(owut check 2>&1)
        V_FROM=$(echo "$OUT" | grep 'Version-from' | awk '{print $2}')
        V_TO=$(echo "$OUT" | grep 'Version-to' | awk '{print $2}')
        SAFE=$(echo "$OUT" | grep -ci 'safe to proceed' || true)
        NO_CHANGE=$(echo "$OUT" | grep -ci 'upgrade not necessary' || true)
        echo "CURRENT_VERSION=${V_FROM:-Unknown}"
        echo "TARGET_VERSION=${V_TO:-Unknown}"
        echo "SAFE_TO_UPGRADE=${SAFE:-0}"
        echo "NO_CHANGE=${NO_CHANGE:-0}"
      register: owut_check_raw
      changed_when: false
      check_mode: false

    - name: Parse Attended Sysupgrade versions
      ansible.builtin.set_fact:
        current_version: "{{ (owut_check_raw.get('stdout', '') | regex_findall('CURRENT_VERSION=(.*)')) | first | default('Unknown') | trim }}"
        target_version: "{{ (owut_check_raw.get('stdout', '') | regex_findall('TARGET_VERSION=(.*)')) | first | default('Unknown') | trim }}"
        safe_to_upgrade: "{{ ((owut_check_raw.get('stdout', '') | regex_findall('SAFE_TO_UPGRADE=(.*)')) | first | default('0') | trim | int) > 0 }}"
        no_change_needed: "{{ ((owut_check_raw.get('stdout', '') | regex_findall('NO_CHANGE=(.*)')) | first | default('0') | trim | int) > 0 }}"

    - name: Evaluate upgrade availability
      ansible.builtin.set_fact:
        upgrade_available: "{{ current_version != target_version and (safe_to_upgrade | bool or not no_change_needed | bool) }}"
        run_live_upgrade: "{{ (perform_sysupgrade | bool or upgrade_packages | bool) and not ansible_check_mode }}"

    - name: Display pre-upgrade status
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " AP: {{ inventory_hostname }} ATTENDED SYSUPGRADE STATUS"
          - "=================================================="
          - " Current Installed Version : {{ current_version }}"
          - " Latest Available Version  : {{ target_version }}"
          - " Upgrade Status            : {{ 'UPGRADE AVAILABLE (' ~ current_version ~ ' -> ' ~ target_version ~ ')' if upgrade_available else 'ALREADY UP TO DATE' }}"
          - " Active Connected Clients  : {{ client_count_before }}"
          - " Required Reconnect Target : {{ target_reconnect_clients }}"
          - " Execution Mode            : {{ 'DRY-RUN (Check Mode)' if ansible_check_mode else ('LIVE ATTENDED SYSUPGRADE' if run_live_upgrade else 'AUDIT ONLY (perform_sysupgrade=false)') }}"
          - "=================================================="

    # --------------------------------------------------------------------------
    # 3. EXECUTE ATTENDED SYSUPGRADE
    # --------------------------------------------------------------------------
    - name: Perform Attended Sysupgrade and reboot
      when:
        - run_live_upgrade | bool
        - upgrade_available | bool
      block:
        - name: Trigger owut upgrade (build, download, verify & flash)
          ansible.builtin.raw: owut upgrade
          register: owut_upgrade_result
          failed_when: false

        - name: Mark AP as upgraded
          ansible.builtin.set_fact:
            ap_was_upgraded: true

        - name: Wait for AP to reboot and resume SSH
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 22
            state: started
            delay: 45
            timeout: 300
          delegate_to: localhost

        - name: Allow wireless radios to initialize
          ansible.builtin.pause:
            seconds: 20

    # --------------------------------------------------------------------------
    # 4. POST-UPGRADE VERIFICATION: Ensure client reconnection or accessibility
    # --------------------------------------------------------------------------
    - name: Wait and verify client reconnection threshold before proceeding to next AP
      when:
        - not ansible_check_mode
        - ap_was_upgraded | default(false) | bool
        - target_reconnect_clients | int > 0
      ansible.builtin.raw: |
        count=0
        for iface in $(cat /etc/librenms/wlInterfaces.txt 2>/dev/null | cut -f1 -d',' || ubus list 'hostapd.*' 2>/dev/null | sed 's/hostapd\.//'); do
          c=$(iwinfo "$iface" assoclist 2>/dev/null | grep -cE '^[0-9A-Fa-f]{2}:' || true)
          count=$((count + c))
        done
        echo "$count"
      register: poll_clients_raw
      until: (poll_clients_raw.stdout | default('0') | trim | int) >= (target_reconnect_clients | int)
      retries: "{{ (reconnect_timeout_seconds | int / reconnect_poll_interval | int) | int }}"
      delay: "{{ reconnect_poll_interval }}"
      changed_when: false

    - name: Verify post-reboot accessibility for APs without connected clients
      when:
        - not ansible_check_mode
        - ap_was_upgraded | default(false) | bool
        - target_reconnect_clients | int == 0
      ansible.builtin.debug:
        msg: "Zero wireless clients connected prior to upgrade on {{ inventory_hostname }}. Verified successful reboot, SSH access, and system readiness."

    - name: Check system uptime and wireless interfaces
      ansible.builtin.raw: uptime; grep 'DISTRIB_DESCRIPTION' /etc/openwrt_release | cut -d= -f2 | tr -d "'"
      register: system_status
      changed_when: false
      check_mode: false

    - name: Query connected wireless clients after upgrade
      ansible.builtin.raw: |
        for iface in $(cat /etc/librenms/wlInterfaces.txt 2>/dev/null | cut -f1 -d',' || ubus list 'hostapd.*' 2>/dev/null | sed 's/hostapd\.//'); do
          iwinfo "$iface" assoclist 2>/dev/null | grep -E '^[0-9A-Fa-f]{2}:' | awk -v i="$iface" '{print i " | " $1 " | signal: " $2 " " $3}'
        done
      register: clients_after_raw
      changed_when: false
      check_mode: false

    - name: Parse post-upgrade client list
      ansible.builtin.set_fact:
        clients_after: "{{ clients_after_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list }}"
        client_count_after: "{{ (clients_after_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list) | length }}"

    - name: Display post-upgrade summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " AP {{ inventory_hostname }} SYSUPGRADE SUMMARY"
          - "=================================================="
          - " Firmware Installed        : {{ (system_status.get('stdout_lines', ['OK', current_version]))[1] | default(current_version) }}"
          - " System Uptime             : {{ (system_status.get('stdout_lines', ['OK']))[0] }}"
          - " Connected Clients BEFORE  : {{ client_count_before }}"
          - " Connected Clients AFTER   : {{ client_count_after }}"
          - " Target Reconnection Met   : {{ ('YES (>= ' ~ target_reconnect_clients ~ ' clients reconnected)') if (ap_was_upgraded and target_reconnect_clients | int > 0) else ('PASS (Zero-client AP: SSH accessibility verified)' if ap_was_upgraded else 'N/A') }}"
          - " Result                    : {{ 'UPGRADED SUCCESSFULLY' if ap_was_upgraded else ('ALREADY UP-TO-DATE' if not upgrade_available else 'AUDIT/DRY-RUN COMPLETE') }}"
          - " Status                    : SUCCESS. Proceeding to next access point..."
          - " Active Clients Now:"
          - "{{ clients_after if client_count_after | int > 0 else ['No clients currently connected'] }}"
