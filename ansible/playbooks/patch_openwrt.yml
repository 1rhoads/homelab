---
# ==============================================================================
# Playbook: OpenWrt Access Point Rolling Package & Security Updates
# ==============================================================================
- name: Patch OpenWrt Access Points (Rolling 1-by-1 with Client Verification)
  hosts: openwrt
  serial: 1 # Strictly upgrade and verify one access point at a time
  gather_facts: false

  vars:
    upgrade_packages: false # Set to true to automatically upgrade packages
    reboot_after_upgrade: false # Set to true to reboot after package upgrade
    min_reconnected_clients: 1 # Minimum clients required to reconnect before next AP
    reconnect_timeout_seconds: 180 # Maximum seconds to wait for client reconnection
    reconnect_poll_interval: 10 # Seconds between retry checks
    skip_reconnect_check_if_empty: true # If AP had 0 clients before upgrade, don't stall waiting for clients

  tasks:
    # --------------------------------------------------------------------------
    # 1. PRE-UPGRADE: Check Connected Client Devices
    # --------------------------------------------------------------------------
    - name: Query connected wireless clients before upgrade
      ansible.builtin.raw: |
        for iface in $(cat /etc/librenms/wlInterfaces.txt 2>/dev/null | cut -f1 -d',' || ubus list 'hostapd.*' 2>/dev/null | sed 's/hostapd\.//'); do
          iwinfo "$iface" assoclist 2>/dev/null | grep -E '^[0-9A-Fa-f]{2}:' | awk -v i="$iface" '{print i " | " $1 " | signal: " $2 " " $3}'
        done
      register: clients_before_raw
      changed_when: false
      check_mode: false

    - name: Parse pre-upgrade client list
      ansible.builtin.set_fact:
        clients_before: "{{ clients_before_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list }}"
        client_count_before: "{{ (clients_before_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list) | length }}"

    - name: Determine required post-upgrade client threshold
      ansible.builtin.set_fact:
        target_reconnect_clients: "{{ 0 if (skip_reconnect_check_if_empty | bool and client_count_before | int == 0) else (min_reconnected_clients | int) }}"
        ap_was_rebooted: false

    - name: Display pre-upgrade connected clients
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " AP: {{ inventory_hostname }} PRE-UPGRADE STATUS"
          - " Active Connected Clients: {{ client_count_before }}"
          - " Required Reconnected Clients: {{ target_reconnect_clients }}"
          - " Mode: {{ 'DRY-RUN (Check Mode)' if ansible_check_mode else 'LIVE EXECUTION' }}"
          - "=================================================="
          - "{{ clients_before if client_count_before | int > 0 else ['No active clients connected prior to upgrade'] }}"

    # --------------------------------------------------------------------------
    # 2. UPGRADE: Check & Apply Updates
    # --------------------------------------------------------------------------
    # OpenWrt 25.x replaced opkg with apk; support both
    - name: Detect OpenWrt package manager
      ansible.builtin.raw: command -v apk >/dev/null && echo apk || echo opkg
      register: pkg_mgr_out
      changed_when: false
      check_mode: false

    - name: Set package manager commands
      ansible.builtin.set_fact:
        pkg_mgr: "{{ pkg_mgr_out.stdout | default('apk') | trim }}"
        pkg_list_upgradable: "{{ 'apk list --upgradable' if (pkg_mgr_out.stdout | default('apk') | trim) == 'apk' else 'opkg list-upgradable' }}"

    - name: Update OpenWrt package lists
      ansible.builtin.raw: "{{ pkg_mgr }} update"
      register: pkg_update
      changed_when: false
      check_mode: false

    - name: List upgradable packages on AP
      ansible.builtin.raw: "{{ pkg_list_upgradable }}"
      register: upgradable_pkgs
      changed_when: false
      check_mode: false

    - name: Display available updates for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "Upgradable packages on {{ inventory_hostname }}:\n{{ upgradable_pkgs.stdout | default('None') }}"

    - name: Apply package upgrades if requested
      when:
        - not ansible_check_mode
        - upgrade_packages | bool
        - (upgradable_pkgs.get('stdout', '')) | trim != ""
      ansible.builtin.raw: |
        if [ "{{ pkg_mgr }}" = apk ]; then
          apk upgrade
        else
          for pkg in $(opkg list-upgradable | awk '{print $1}'); do
            opkg upgrade $pkg
          done
        fi
      register: upgrade_result

    # --------------------------------------------------------------------------
    # 3. REBOOT & POST-REBOOT RECOVERY
    # --------------------------------------------------------------------------
    - name: Reboot AP if requested and packages updated
      when:
        - not ansible_check_mode
        - reboot_after_upgrade | bool
        - upgrade_result is defined
        - (upgrade_result.get('changed', false) or (upgrade_result.get('stdout', '') | trim != ''))
      block:
        - name: Trigger reboot
          ansible.builtin.raw: reboot
          ignore_errors: true

        - name: Wait for AP to resume SSH
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 22
            delay: 15
            timeout: 180
          delegate_to: localhost

        - name: Allow wireless radios to initialize
          ansible.builtin.pause:
            seconds: 15

        - name: Mark AP as rebooted
          ansible.builtin.set_fact:
            ap_was_rebooted: true

    # --------------------------------------------------------------------------
    # 4. POST-UPGRADE VERIFICATION: Ensure at least one client has reconnected
    # --------------------------------------------------------------------------
    - name: Wait and verify client reconnection threshold before proceeding to next AP
      when:
        - not ansible_check_mode
        - ap_was_rebooted | default(false) | bool
      ansible.builtin.raw: |
        count=0
        for iface in $(cat /etc/librenms/wlInterfaces.txt 2>/dev/null | cut -f1 -d',' || ubus list 'hostapd.*' 2>/dev/null | sed 's/hostapd\.//'); do
          c=$(iwinfo "$iface" assoclist 2>/dev/null | grep -cE '^[0-9A-Fa-f]{2}:' || true)
          count=$((count + c))
        done
        echo "$count"
      register: poll_clients_raw
      until: (poll_clients_raw.stdout | default('0') | trim | int) >= (target_reconnect_clients | int)
      retries: "{{ (reconnect_timeout_seconds | int / reconnect_poll_interval | int) | int }}"
      delay: "{{ reconnect_poll_interval }}"
      changed_when: false

    - name: Check system uptime and wireless interfaces
      ansible.builtin.raw: uptime; ubus call network.wireless status
      register: wifi_status
      changed_when: false
      check_mode: false

    - name: Query connected wireless clients after upgrade
      ansible.builtin.raw: |
        for iface in $(cat /etc/librenms/wlInterfaces.txt 2>/dev/null | cut -f1 -d',' || ubus list 'hostapd.*' 2>/dev/null | sed 's/hostapd\.//'); do
          iwinfo "$iface" assoclist 2>/dev/null | grep -E '^[0-9A-Fa-f]{2}:' | awk -v i="$iface" '{print i " | " $1 " | signal: " $2 " " $3}'
        done
      register: clients_after_raw
      changed_when: false
      check_mode: false

    - name: Parse post-upgrade client list
      ansible.builtin.set_fact:
        clients_after: "{{ clients_after_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list }}"
        client_count_after: "{{ (clients_after_raw.get('stdout_lines', []) | map('trim') | reject('equalto', '') | list) | length }}"

    - name: Display post-upgrade client verification summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " AP {{ inventory_hostname }} {{ 'DRY-RUN SUMMARY' if ansible_check_mode else 'UPGRADE & CLIENT VERIFICATION' }}"
          - "=================================================="
          - "Uptime / Load              : {{ (wifi_status.get('stdout_lines', ['OK']))[0] }}"
          - "Connected Clients BEFORE   : {{ client_count_before }}"
          - "Connected Clients AFTER    : {{ client_count_after }}"
          - "Target Reconnection Met    : {{ 'N/A (Dry Run / No Reboot)' if (ansible_check_mode or not (ap_was_rebooted | default(false) | bool)) else 'YES (>= ' ~ target_reconnect_clients ~ ')' }}"
          - "Status: SUCCESS. Proceeding to next access point..."
          - "Active Clients Now:"
          - "{{ clients_after if client_count_after | int > 0 else ['No clients currently connected'] }}"
